<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gladihoppers · Modded</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05030a;color:#fff;font-family:system-ui,sans-serif}
    #unity-container{width:100%;height:100%;position:relative}
    #gh-progress{position:fixed;left:16px;right:16px;bottom:18px;text-align:center;z-index:10;color:#ddd6fe;font-size:13px;pointer-events:none;text-shadow:0 1px 5px #000}
  </style>
  <script src="https://cdn.jsdelivr.net/gh/genizy/gh/patch/js/UnityLoader.2019.2.js"></script>
</head>
<body>
  <div id="unity-container"></div>
  <div id="gh-progress" role="status">Loading Gladihoppers… connecting to game files</div>
  <script>
    const progress=document.getElementById('gh-progress');
    const idle=()=>{};
    window.PokiSDK={init:()=>Promise.resolve(),commercialBreak:()=>Promise.resolve(),rewardedBreak:()=>Promise.resolve(false)};
    for(const method of ['customEvent','destroyAd','displayAd','gameInteractive','gameLoadingFinished','gameLoadingProgress','gameLoadingStart','gameplayStart','gameplayStop','happyTime','roundEnd','roundStart','setPlayerAge','togglePlayerAdvertisingConsent'])window.PokiSDK[method]=idle;
    window.initPokiBridge=function(name){
      const send=(method,value)=>window.unityGame&&window.unityGame.SendMessage(name,method,value);
      window.commercialBreak=()=>Promise.resolve().then(()=>send('commercialBreakCompleted'));
      window.rewardedBreak=()=>Promise.resolve().then(()=>send('rewardedBreakCompleted','false'));
      if(window.unityGame)send('ready');
      else window.addEventListener('load',()=>send('ready'),{once:true});
    };
    let progressSeen=false;
    try {
      if(!window.UnityLoader) throw new Error('Unity WebGL loader did not download');
      window.unityGame=window.gameInstance=UnityLoader.instantiate(
        'unity-container',
        'https://cdn.jsdelivr.net/gh/genizy/gh/Build/Gladihoppers.json',
        {
          onProgress(instance,value){
            progressSeen=true;
            progress.textContent='Loading Gladihoppers… '+Math.round(value*100)+'%';
            if(value>=1)progress.hidden=true;
          },
          onerror(error){
            progress.textContent='Gladihoppers failed to start. Reload the page and try again.';
            console.error('Gladihoppers Unity error:',error);
          }
        }
      );
    } catch(error) {
      progress.textContent='Gladihoppers loader error: '+error.message;
      console.error(error);
    }
    setTimeout(()=>{
      if(!progressSeen && !progress.hidden) {
        progress.textContent='Still waiting for the Unity game files. The game host may be blocked or unavailable on this network.';
      }
    },30000);
    const modScript=document.createElement('script');
    modScript.src=new URL('mod-menu.js',location.href).href;
    modScript.onerror=()=>console.error('Gladihoppers mod menu script failed to load.');
    document.body.append(modScript);
  </script>
</body>
</html>
