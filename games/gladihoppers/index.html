<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Gladihoppers</title>

    <script>
        // Folder this page lives in on GitHub Pages. Captured before the <base>
        // tag below so the JavaScript files can be loaded from this repo.
        // raw.githubusercontent.com serves .js as text/plain + nosniff, so
        // browsers refuse to run scripts from it (that caused the white screen).
        window.GH_LOCAL = location.href.split(/[?#]/)[0].replace(/[^\/]*$/, '');
    </script>

    <!-- Large game data (binaries, json, images) still comes from GitHub raw.
         Binary downloads via fetch/XHR work fine there; only <script> is blocked. -->
    <base href="https://raw.githubusercontent.com/bubbls/UGS-Assets/main/gladihoppper/">

    <script>
        window.fileMergerConfig = {
            files: [
                { name: 'Gladihoppers.data.unityweb', parts: 2 },
                { name: 'Gladihoppers.wasm.code.unityweb', parts: 2 }
            ],
            basePath: 'https://raw.githubusercontent.com/bubbls/UGS-Assets/main/gladihoppper/Build/',
            debug: true
        };

        window.config = {
            loader: 'unity',
            debug: false,
            maxRatio: 16 / 9,
            minRatio: 9 / 16,

            title: 'Gladihoppers',
            thumbnail: 'patch/png/null.png',
            numScreenshots: 5,

            unityVersion: '2019.3.13f1',
            unityWebglBuildUrl: 'Build/Gladihoppers.json',
            unityWebglLoaderUrl: window.GH_LOCAL + 'UnityLoader.2019.2.js',

            fileSize: 23,
            cachedDecompressedFileSizes: {
                'Gladihoppers.data.unityweb': 17409938,
                'Gladihoppers.wasm.code.unityweb': 6410659,
                'Gladihoppers.wasm.framework.unityweb': 91463
            }
        };
    </script>
</head>
<body style="margin:0;background:#231F20">
    <script>
        (function () {
            function showError(msg) {
                var d = document.createElement('div');
                d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;' +
                    'padding:12px;background:#300;color:#fff;border:1px solid #f66;border-radius:8px;' +
                    'font:13px monospace;white-space:pre-wrap';
                d.textContent = 'Gladihoppers failed to load: ' + msg;
                document.body.appendChild(d);
            }
            window.addEventListener('error', function (e) {
                if (e.message) showError(e.message);
            });

            // Same chain poki-master-loader.js used, but from this repo's copies.
            // mod-menu.js reads window.unityGame (set by poki-unity.js); toggle with "/".
            var scripts = ['merge.js', 'patch/js/poki-sdk.js', 'patch/js/poki-unity.js', 'mod-menu.js'];
            (function next(i) {
                if (i >= scripts.length) return;
                var s = document.createElement('script');
                s.src = window.GH_LOCAL + scripts[i];
                s.onload = function () { next(i + 1); };
                s.onerror = function () { showError('could not load ' + s.src); };
                document.body.appendChild(s);
            })(0);
        })();
    </script>
</body>
</html>
